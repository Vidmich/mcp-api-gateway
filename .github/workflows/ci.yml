# Every commit, on every platform and version the project claims to support.
#
# The claim lives in pyproject's `requires-python` and its classifiers. This
# file is what makes it a fact rather than an intention: 3.11 is the floor
# because the config loader uses `tomllib`, 3.14 is what the project is
# developed on, and Windows is in the matrix because the key file is locked
# down with `icacls` there and with POSIX modes everywhere else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's results irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # Ruff's verdict does not depend on the interpreter running it or on the
  # operating system underneath: the target version is pinned in pyproject and
  # line endings are normalised by .gitattributes. Running it in every matrix
  # cell would produce twelve identical answers, so it runs once.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: python -m pip install -e ".[dev]"

      - run: ruff check .

      - run: ruff format --check .

  # mypy is in here rather than beside ruff for the opposite reason: it narrows
  # on `sys.platform` and on the version's own typeshed, so it genuinely gives
  # different answers per cell, and the Windows-only branches are only ever
  # type-checked on the Windows runner.
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - run: python -m pip install -e ".[dev]"

      - run: mypy src

      # The suite needs no network and binds only to the loopback, so a runner
      # with no outbound access is a valid place to run it.
      #
      # Run even when mypy has already failed the cell. The two say different
      # things, and a cell that stops at the first of them reports half of what
      # is wrong with it: task 117 was two separate defects that looked like one
      # per operating system, because the eight cells failing mypy never reached
      # the suite. `!cancelled()` rather than `always()`, so a cancelled run
      # still stops.
      - run: pytest
        if: ${{ !cancelled() }}

  # The same build the release runs, so the packaging failure that only shows
  # up in a wheel is found on the commit that caused it.
  package:
    name: Package
    uses: ./.github/workflows/package.yml
