# Build the distributions, and prove they work before anything is published.
#
# Called by both ci.yml and release.yml, which is the point: the artifacts a tag
# uploads to PyPI come out of the same job that has been running on every commit
# for months, rather than out of a release-only path nobody has exercised.
#
# The wheel is pure Python, so it is built once. Installing it is what varies by
# platform, so that part is a matrix.
name: Package

on:
  workflow_call:
    inputs:
      tag:
        description: >-
          The tag being released, e.g. v0.1.0. When given, the build refuses to
          continue unless it names the version in the source tree. Empty on an
          ordinary CI run, where there is no tag to disagree with.
        type: string
        default: ""

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm is not in use, but a shallow clone still costs
          # nothing to widen and makes the tag visible to anything that looks.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Before the build rather than after: a tag that disagrees with the source
      # tree should cost seconds, not a full matrix.
      - name: The tag must name the version in the source tree
        if: inputs.tag != ''
        run: python scripts/release.py version --tag "${{ inputs.tag }}"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      # The check that matters for a project whose UI is data files. Everything
      # it looks for is derived from the source tree, so it covers whatever was
      # added since this file was last read.
      - name: The wheel must carry the templates and the static assets
        run: |
          for wheel in dist/*.whl; do
            python scripts/release.py wheel "$wheel"
          done

      - name: What was built
        run: ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  install:
    name: Install on ${{ matrix.os }} · py${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor and the ceiling. Everything between them is covered by the
        # test matrix in ci.yml; what is being tested here is the install, and
        # the two ends are where an install breaks.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      # A venv holding the wheel and its dependencies and nothing else — no dev
      # extra, no editable checkout, no pytest. If the gateway needs something
      # that is only present because a developer had it, this is where it shows.
      - name: Install the wheel into a clean environment and use it
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .smoke
          PY=".smoke/bin/python"
          [ -x "$PY" ] || PY=".smoke/Scripts/python.exe"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$PY" scripts/release.py smoke
