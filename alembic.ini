# Alembic configuration for development.
#
# A running gateway does not read this file: it builds its own configuration in
# mcp_gateway.db.migrate and upgrades the database during startup. This is here
# so that `alembic revision --autogenerate` and `alembic upgrade head` work from
# a checkout.
#
# The URL below is the default data directory. Override it per invocation with
#   alembic -x url=sqlite+aiosqlite:///path/to/gateway.db upgrade head
# or by setting ALEMBIC_DATABASE_URL.
#
# Autogenerated revisions are machine-formatted; run `ruff format` over the
# new file before committing it.

[alembic]
script_location = src/mcp_gateway/db/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///./data/gateway.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-8s %(name)s: %(message)s
